version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lol-dashboard-db
    environment:
      POSTGRES_DB: lol_team_dashboard
      POSTGRES_USER: lol_dashboard
      POSTGRES_PASSWORD: dashboard_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - lol-dashboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lol_dashboard -d lol_team_dashboard"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lol-dashboard-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://lol_dashboard:dashboard_password_dev@postgres:5432/lol_team_dashboard
      JWT_SECRET: dev_jwt_secret_change_in_production
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - lol-dashboard-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lol-dashboard-frontend
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - lol-dashboard-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  lol-dashboard-network:
    driver: bridge